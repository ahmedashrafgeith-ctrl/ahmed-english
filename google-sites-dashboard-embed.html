<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ahmed English — Staff Dashboard</title>
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; overflow: hidden; }
    #stage { position: relative; width: 100%; height: 100vh; overflow: hidden; }
    iframe { display: block; border: 0; position: absolute; top: 0; left: 0; transform-origin: top left; }
    #zoombar {
      position: fixed; top: 10px; right: 10px; z-index: 99999;
      display: flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,.92); border: 1px solid #ddd;
      border-radius: 999px; padding: 4px 8px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
      font-family: Arial, sans-serif;
    }
    #zoombar button {
      width: 30px; height: 30px; border: 0; border-radius: 50%;
      background: #4F46E5; color: #fff; font-size: 18px; line-height: 1;
      cursor: pointer; font-weight: 700;
    }
    #zoombar button:hover { background: #4338CA; }
    #zoombar .zval { font-size: 12px; font-weight: 700; color: #333; min-width: 40px; text-align: center; }
    #zoombar .zfit { font-size: 12px; width: auto; padding: 0 10px; border-radius: 999px; }
  </style>
</head>
<body>
  <div id="stage">
    <iframe id="app"
      src="https://ahmedashrafgeith-ctrl.github.io/ahmed-english/dashboard.html"
      title="Ahmed English Staff Dashboard"
      scrolling="no"></iframe>
  </div>
  <div id="zoombar">
    <button type="button" id="zminus" title="Zoom out">−</button>
    <span class="zval" id="zval">100%</span>
    <button type="button" id="zplus" title="Zoom in">+</button>
    <button type="button" class="zfit" id="zfit" title="Fit to screen">Fit</button>
  </div>
  <script>
    (function () {
      var iframe = document.getElementById('app');
      var stage = document.getElementById('stage');
      var zval = document.getElementById('zval');
      var DESIGN = 1366;
      var FULL_H = 2600;
      var ratio = 1;

      function apply(scale) {
        ratio = scale;
        iframe.style.width = DESIGN + 'px';
        iframe.style.height = FULL_H + 'px';
        iframe.style.transform = 'scale(' + scale + ')';
        stage.style.width = (DESIGN * scale) + 'px';
        stage.style.height = (FULL_H * scale) + 'px';
        zval.textContent = Math.round(scale * 100) + '%';
      }

      function autoFit() {
        var availW = document.documentElement.clientWidth || window.innerWidth || DESIGN;
        var availH = document.documentElement.clientHeight || window.innerHeight || FULL_H;
        apply(Math.min(availW / DESIGN, availH / FULL_H));
      }

      document.getElementById('zplus').addEventListener('click', function () { apply(ratio * 1.1); });
      document.getElementById('zminus').addEventListener('click', function () { apply(ratio / 1.1); });
      document.getElementById('zfit').addEventListener('click', autoFit);

      window.addEventListener('load', function () { setTimeout(autoFit, 200); setTimeout(autoFit, 700); });
      document.addEventListener('DOMContentLoaded', function () { setTimeout(autoFit, 100); });
      autoFit();
    })();
  </script>
</body>
</html>
