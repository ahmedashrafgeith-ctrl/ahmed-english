<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login & Portal Access — TUTOR PRO</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</head>
<body class="auth-page">

  <main class="auth-box">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:28px;">
      <span class="brand-badge">TUTOR PRO</span>
      <div>
        <strong style="font-family:var(--font-heading);font-size:1.2rem;display:block;">Student & Tutor Portal</strong>
        <div style="font-size:0.82rem;color:var(--ink-muted);font-weight:700;">Executive Learning Platform</div>
      </div>
    </div>

    <h2 id="mode-title" style="font-size:1.85rem;margin-bottom:8px;">Welcome Back</h2>
    <p class="lead" id="mode-sub" style="font-size:0.95rem;margin-bottom:28px;">
      Sign in to view your scheduled lessons, homework assignments, and coaching materials.
    </p>

    <form id="auth-form">
      <div class="form-group" id="full-name-group" style="display:none;">
        <label for="full_name">Full Name</label>
        <input class="form-control" id="full_name" type="text" placeholder="e.g. Sarah Miller">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input class="form-control" id="email" type="email" placeholder="name@company.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-control" id="password" type="password" placeholder="••••••••" required minlength="6">
      </div>

      <div class="form-group" id="role-group" style="display:none;">
        <label for="role">Account Type</label>
        <select class="form-control" id="role">
          <option value="student">Student</option>
          <option value="tutor">Tutor Workspace Owner</option>
        </select>
      </div>

      <button class="btn btn-primary" style="width:100%;margin-top:10px;" id="submit-btn" type="submit">
        Sign In
      </button>

      <div class="message-box" id="message"></div>
    </form>

    <div style="text-align:center;margin-top:24px;padding-top:24px;border-top:1px solid #e2e8f0;font-size:0.92rem;">
      <p style="margin-bottom:14px;">
        <a href="#" id="switcher" style="color:var(--accent-violet);font-weight:800;text-decoration:none;">
          Don't have an account? Create one
        </a>
      </p>
      <a href="index.html" style="color:var(--ink-muted);text-decoration:none;font-size:0.88rem;font-weight:600;">
        ← Return to Main Website
      </a>
    </div>
  </main>

</body>
</html>
