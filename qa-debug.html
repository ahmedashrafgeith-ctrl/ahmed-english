<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QA Debug Harness</title>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
<pre id="out">starting...</pre>
<script>
  var out = document.getElementById('out');
  function log(s) { out.textContent += '\n' + s; }
  window.__frameErrors = [];

  (async function () {
    var sb = getSupabase();
    if (!sb) { log('NO_SB'); return; }
    try {
      await sb.auth.signInWithPassword({
        email: 'qa-admin-03c69c7d@proenglishtutor.online',
        password: 'Qa03c69c7d!T9xZ2'
      });
    } catch (e) { log('SIGNIN ' + (e.message||'')); return; }
    log('signed in');

    var f = document.createElement('iframe');
    f.id = 'adm';
    f.src = 'admin.html';
    f.style.width = '420px';
    f.style.height = '1200px';
    document.body.appendChild(f);

    f.onload = function () {
      setTimeout(run, 3000);
    };

    async function run() {
      var w = f.contentWindow, d = f.contentDocument;
      // capture iframe errors
      try { w.onerror = function (msg, src, ln, col) { window.__frameErrors.push(String(msg)+' @'+ln+':'+col); log('IFRAME-ERR: '+msg+' @'+ln+':'+col); }; } catch(e){ log('cannot set onerror'); }

      function q(sel) { return d.querySelector(sel); }
      function count(sel) { return d.querySelectorAll(sel).length; }

      try {
        log('--- initial ---');
        log('dash display: ' + q('#admin-dash-view').style.display);
        log('ads display: ' + q('#admin-ads-view').style.display);
        log('preview slots: ' + count('.ads-slot-meta'));
        log('body children before: ' + d.body.children.length);

        // click Ads & Tracking side link
        var adsLink = d.querySelector('.side-link[href="#ads-panel"]');
        log('ads link found: ' + !!adsLink);
        if (adsLink) adsLink.click();
        await sleep(800);
        log('--- after ads click ---');
        log('dash display: ' + q('#admin-dash-view').style.display);
        log('ads display: ' + q('#admin-ads-view').style.display);
        log('body children after ads: ' + d.body.children.length);

        // click Overview (back to dashboard)
        var ov = d.querySelector('.side-link[href="#overview"]');
        if (ov) ov.click();
        await sleep(800);
        log('--- after overview click ---');
        log('dash display: ' + q('#admin-dash-view').style.display);
        log('ads display: ' + q('#admin-ads-view').style.display);
        log('body children after overview: ' + d.body.children.length);

        // click ads again, type in a slot input to trigger input listener
        var adsLink2 = d.querySelector('.side-link[href="#ads-panel"]');
        if (adsLink2) adsLink2.click();
        await sleep(600);
        var slotInput = d.querySelector('[data-zone-slot="banner"]');
        if (slotInput) { slotInput.value = 'ca-pub-test'; slotInput.dispatchEvent(new w.Event('input')); }
        await sleep(400);
        log('--- after edit slot input ---');
        log('body children after edit: ' + d.body.children.length);
        log('preview slots after edit: ' + count('.ads-slot-meta'));

        // ads save click
        var save = d.getElementById('ads-save-btn');
        if (save) save.click();
        await sleep(400);
        log('--- after save click ---');
        log('body children after save: ' + d.body.children.length);
        log('errors captured: ' + window.__frameErrors.length);
        log('DONE');
      } catch (e) {
        log('HARNESS-ERR: ' + e.message);
      }
    }
    function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  })();
</script>
</body>
</html>
