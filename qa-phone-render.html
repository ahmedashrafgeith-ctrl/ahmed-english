<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Overflow Check</title>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <style> body { margin:0; } pre{background:#111;color:#0f0;font-size:11px;white-space:pre-wrap;padding:6px;margin:0;} iframe{display:block;border:0;} </style>
</head>
<body>
<pre id="log">starting...</pre>
<div id="host"></div>
<script>
  var logEl = document.getElementById('log');
  function log(s){ logEl.textContent += '\n' + s; }
  (async function () {
    var sb = getSupabase();
    if (!sb) { log('NO_SB'); return; }
    try { await sb.auth.signInWithPassword({ email: 'qa-admin-03c69c7d@proenglishtutor.online', password: 'Qa03c69c7d!T9xZ2' }); log('SIGNIN OK'); }
    catch (e) { log('SIGNIN ERR ' + (e.message||'')); return; }

    var targets = ['admin.html','dashboard.html'];
    for (var t = 0; t < targets.length; t++) {
      var f = document.createElement('iframe');
      f.src = targets[t];
      f.style.width = '390px'; f.style.height = '844px';
      document.getElementById('host').appendChild(f);
      await new Promise(r => f.onload = r);
      await new Promise(r => setTimeout(r, 4500));
      var doc = f.contentDocument, win = f.contentWindow;
      function parseInt(n){ return window.parseInt(n,10); } // avoid shadowing in iframe-safe scope
      try {
        var scW = doc.documentElement.scrollWidth;
        var clW = doc.documentElement.clientWidth;
        var body = doc.body;
        var sW = parseInt(win.getComputedStyle(body).width,10) || 0;
        log("=== " + targets[t] + " ===");
        log("  scrollWidth=" + scW + " clientWidth=" + clW + " => OVERFLOW=" + (scW > clW ? 'YES' : 'no'));
        log("  body width=" + sW);
        // list the widest elements
        var widest = [];
        var all = doc.querySelectorAll('body *');
        for (var i = 0; i < all.length; i++) {
          var el = all[i];
          var r = el.getBoundingClientRect();
          if (r.width > clW + 2) {
            widest.push(el.tagName + '.' + (el.className ? String(el.className).split(' ')[0] : '') + ' w=' + Math.round(r.width));
            if (widest.length > 12) break;
          }
        }
        log("  elements wider than viewport:");
        widest.forEach(function(x){ log("    " + x); });
      } catch (e2) { log("  ERR " + e2.message); }
    }
    log('DONE');
  })();
</script>
</body>
</html>
