<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting&hellip; - TutorEnglishPro</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0F172A;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center}
    .c{padding:24px}.sp{width:34px;height:34px;border:3px solid rgba(255,255,255,.2);border-top-color:#E8724A;border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite}
    @keyframes r{to{transform:rotate(360deg)}}
    a{color:#F4B95E}
  </style>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
  <div class="c">
    <div class="sp"></div>
    <div id="msg">Taking you there&hellip;</div>
  </div>
  <script>
    (function () {
      // Pretty short links: https://www.proenglishtutor.online/<code>
      // GitHub Pages serves this file for any path that does not exist, so a
      // real page like /packages.html never reaches here - only short codes do.
      var raw = decodeURIComponent(window.location.pathname || '').replace(/^\/+|\/+$/g, '');
      var parts = raw.split('/').filter(Boolean);
      var code = parts[0] || '';
      if (!/^[A-Za-z0-9_-]{1,64}$/.test(code)) { finish('This link is not available.'); return; }

      var cfg = (window.APP_CONFIG && APP_CONFIG.supabase) || {};
      if (!cfg.url || !cfg.anonKey) { finish('Link service unavailable.'); return; }

      try {
        var sb = getSupabase();
        sb.from('shortlinks').select('url').eq('code', code).maybeSingle().then(function (res) {
          var url = res.data && res.data.url;
          if (!url) { finish('This link is no longer available.'); return; }
          // log the click into visitor analytics (best-effort, no cookies)
          trackClick(code);
          // increment the click counter (read-then-update, races are fine)
          sb.from('shortlinks').select('hits').eq('code', code).maybeSingle().then(function (rr) {
            var hits = (rr.data && rr.data.hits) || 0;
            sb.from('shortlinks').update({ hits: hits + 1 }).eq('code', code).then(function () {}, function () {});
            window.location.replace(url);
          }, function () { window.location.replace(url); });
        }, function () { finish('Could not resolve this link.'); });
      } catch (e) { finish('Link service error.'); }

      function trackClick(code) {
        try {
          var ua = navigator.userAgent || '';
          var device = 'desktop';
          if (/Mobi|Android|iPhone|iPod/.test(ua)) device = 'mobile';
          else if (/iPad|Tablet|Silk/.test(ua)) device = 'tablet';
          var browser = 'Other';
          if (/Edg\//.test(ua)) browser = 'Edge';
          else if (/OPR\/|Opera/.test(ua)) browser = 'Opera';
          else if (/SamsungBrowser/.test(ua)) browser = 'Samsung Internet';
          else if (/Firefox\//.test(ua)) browser = 'Firefox';
          else if (/Chrome\/|CriOS\//.test(ua)) browser = 'Chrome';
          else if (/Safari\//.test(ua)) browser = 'Safari';
          var os = 'Other';
          if (/Windows/.test(ua)) os = 'Windows';
          else if (/Android/.test(ua)) os = 'Android';
          else if (/iPhone|iPad|iPod/.test(ua)) os = 'iOS';
          else if (/Mac OS X|Macintosh/.test(ua)) os = 'macOS';
          else if (/Linux/.test(ua)) os = 'Linux';
          var country = 'Unknown';
          try {
            var lang = (navigator.language || '');
            var ll = lang.split('-')[1] || lang.split('_')[1] || '';
            if (/^[A-Z]{2}$/.test(ll)) country = ll;
          } catch (e) {}
          sb.from('visitor_views').insert({
            path: '/go/' + code,
            referrer: document.referrer || '',
            title: 'Short link: ' + code,
            device: device,
            browser: browser,
            os: os,
            country: country,
            screen: (screen.width || 0) + 'x' + (screen.height || 0),
            created_at: new Date().toISOString()
          }).then(function () {}, function () {});
        } catch (e) {}
      }

      function finish(msg) {
        document.getElementById('msg').innerHTML = msg + ' <a href="index.html">Go to homepage</a>';
      }
    })();
  </script>
</body>
</html>
